nerdfont: true

base_branch: origin/main
agent: pi

mode: session
window_prefix: ""
windows:
  - panes:
      - {}
      - command: <agent>
        focus: true
        split: horizontal

auto_name:
  command: pi --no-extensions -p
  model: mai-code-1.1-flash
  background: true

sidebar:
  sort: window
  templates:
    tiles:
      - "{git_branch}{fill} {pr_number}"
      - "{project} {fill} {git_stats}"
      - "{pr_number} {fill} {pr_checks}"

files:
  copy:
    - ".workmux.yaml"

agents:
  low-effort:
    type: pi
    when: for straightforward text, configuration changes or scaffolding
    description: Simple Cheap Low effort agent
    args:
      - --model
      - github-copilot/gpt-5.6-luna
      - --thinking
      - minimal
  migrator:
    type: pi
    when: for easy slightly involved work live renames and migrations
    description: Simple rename or migration
    args:
      - --model
      - github-copilot/gpt-5.6-luna
      - --thinking
      - low
  basic-feature:
    type: pi
    when: for straightforward general purpose feature work
    description: For basic feature work
    args:
      - --model
      - github-copilot/gpt-5.6-luna
      - --thinking
      - medium
  involved-feature:
    type: pi
    when: for an involved feature touching multiple components or requiring more research
    description: For involved feature work
    args:
      - --model
      - github-copilot/gpt-5.6-terra
      - --thinking
      - medium
  architecture:
    type: pi
    when: for complex work on fundamental code, impacting the entire codebase
    description: For complex fundamental codeSimple rename or migration
    args:
      - --model
      - github-copilot/gpt-5.6-terra
      - --thinking
      - medium

#-------------------------------------------------------------------------------
# Dashboard
#-------------------------------------------------------------------------------

# Actions for dashboard keybindings (c = commit, m = merge).
# Values are sent to the agent's pane. Use ! prefix for shell commands.
# Preview size (10-90): larger = more preview, less table. Use +/- keys to adjust.
# Columns of the agents table, in display order. Omit a column to hide it:
# number, project, worktree, git, pr, status, time, title.
# Worktree columns: number, project, worktree, git, pr, mux, age, agent.
# Default sort mode for the agent list: priority (default), project, recency, natural.
# Used only when no sort preference has been persisted in the dashboard.
