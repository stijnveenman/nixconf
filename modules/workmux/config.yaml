#   commit: "Commit staged changes with a descriptive message"
#   merge: "!workmux merge"
#   preview_size: 60
#   agent_columns: [number, project, worktree, git, pr, status, time, title]
#   worktree_columns: [number, project, worktree, git, pr, mux, age, agent]
